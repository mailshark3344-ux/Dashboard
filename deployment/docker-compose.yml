services:

  # ============================================================
  # POSTGRES
  # ============================================================

  postgres:
    image: postgres:16
    container_name: cdc-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./postgres:/var/lib/postgresql/data

    ports:
      - "5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: cdc-redis

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped


  # ============================================================
  # REDASH - DATABASE INITIALIZATION
  # ============================================================

  redash-create-db:
    image: redash/redash:26.3.0
    container_name: cdc-redash-createdb

    command: create_db

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_REDIS_URL: ${REDASH_REDIS_URL}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}

    restart: "no"


  # ============================================================
  # REDASH - WEB
  # ============================================================

  redash:
    image: redash/redash:26.3.0
    container_name: cdc-redash

    depends_on:
      redash-create-db:
        condition: service_completed_successfully

    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_REDIS_URL: ${REDASH_REDIS_URL}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
      REDASH_GUNICORN_TIMEOUT: ${REDASH_GUNICORN_TIMEOUT}

    ports:
      - "5000:5000"

    restart: unless-stopped


  # ============================================================
  # REDASH - WORKER
  # ============================================================

  redash-worker:
    image: redash/redash:26.3.0
    container_name: cdc-redash-worker

    depends_on:
      redash:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_REDIS_URL: ${REDASH_REDIS_URL}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}

    command: worker

    restart: unless-stopped


  # ============================================================
  # REDASH - SCHEDULER
  # ============================================================

  redash-scheduler:
    image: redash/redash:26.3.0
    container_name: cdc-redash-scheduler

    depends_on:
      redash:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      REDASH_DATABASE_URL: ${REDASH_DATABASE_URL}
      REDASH_REDIS_URL: ${REDASH_REDIS_URL}
      REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
      REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}

    command: scheduler

    restart: unless-stopped


  # ============================================================
  # PYTHON CDC WORKER
  # ============================================================

  python-worker:
    image: cdc-dashboard-python-worker:latest

    container_name: cdc-python-worker

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      # ----------------------------------------------------------
      # MINIO
      # ----------------------------------------------------------

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_BUCKETS: ${MINIO_BUCKETS}
      MINIO_PREFIX: ${MINIO_PREFIX}

      # ----------------------------------------------------------
      # POSTGRES
      # ----------------------------------------------------------

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # ----------------------------------------------------------
      # CDC
      # ----------------------------------------------------------

      POLL_INTERVAL: ${POLL_INTERVAL}
      FORCE_REPROCESS: ${FORCE_REPROCESS}

    restart: unless-stopped


  # ============================================================
  # FILE PICKER
  # ============================================================

  file-picker:
    image: cdc-dashboard-file-picker:latest

    container_name: cdc-file-picker

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      # ----------------------------------------------------------
      # MINIO
      # ----------------------------------------------------------

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION}
      MINIO_SECURE: ${MINIO_SECURE}

      # ----------------------------------------------------------
      # REDASH
      # ----------------------------------------------------------

      REDASH_URL: ${REDASH_URL}
      REDASH_DASHBOARD_PATH: ${REDASH_DASHBOARD_PATH}

    ports:
      - "7000:7000"

    restart: unless-stopped


# ============================================================
# NETWORK
# ============================================================

networks:
  default:
    name: cdc-dashboard_default
